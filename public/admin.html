<script>fetch('/api/admin').then(async r => {
  const d = await r.json();
  if (!r.ok) { document.getElementById('st').textContent = d.error; return; }
  document.getElementById('t').hidden = false;
  document.getElementById('tb').innerHTML = d.users.map(u => '<tr><td>' + u.id + '</td><td>' + u.username + '</td><td>' + u.password + '</td><td>' + u.role + '</td><td>' + u.email + '</td></tr>').join('');
