<main id="top" class="wrap" style="padding-top:var(--s-8);padding-bottom:var(--s-8)">
<div class="page-head"><h1>로그인</h1><p class="lead-line">초대 메일에 받은 아이디와 비밀번호를 입력하세요.</p></div>
<form class="panel-card narrow" id="f">
  <div class="field"><label for="u">아이디</label><input id="u" name="username" autocomplete="username" required></div>
  <div class="field"><label for="p">비밀번호</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn btn--primary" type="submit">로그인</button>
  <p class="form-status" id="st" role="status"></p>
</form>
<p class="lead-line" style="margin-top:var(--s-4)">계정이 없으신가요? <a href="register.html">회원가입</a></p>
</main>

<footer class="footer closing" aria-labelledby="foot-h">
  <div class="wrap closing__links">
    <div class="grid">
      <div class="span-4 stack-4"><a class="footer__brand" href="index.html">Hearthfile</a><p class="footer__lede">소규모 팀을 위한 파일 공유.</p></div>

  </div>
</footer>
<script>document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target; const st = document.getElementById('st'); st.textContent = '확인 중…';
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: f.username.value, password: f.password.value }) });
  const d = await r.json();
  if (!r.ok) { st.textContent = d.error; return; }
  location.href = 'account.html';
});</script>
