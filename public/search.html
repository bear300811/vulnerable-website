:root {
  --p-bg: #f8f8f8; --p-surface: #eeeeee; --p-ink: #0a0a0a; --p-muted: #6a6a6a;

  --p-inv-accent: #1f6b3a; --p-inv-accent-ink: #ffffff; --p-inv-action: #1f6b3a; --p-inv-action-ink: #ffffff;
  --font-display: "Mona Sans", system-ui, sans-serif;
  --font-text: "Mona Sans", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --display-weight: 500;
  --display-tracking: -0.03em;
  --display-tracking-xl: -0.04em;
  --display-stretch: 104%;
  --ly-scale: 0.96;
}

<meta name="description" content="Hearthfile에서 팀원과 공유 폴더를 검색합니다.">

<body>

<header class="nav">
  <div class="wrap nav__bar">
    <a class="skip-link" href="#top">본문으로 건너뛰기</a>
    <a class="nav__logo" href="index.html"><span class="mark mark--initial" aria-hidden="true">H</span>Hearthfile</a>
    <nav class="nav__links" aria-label="주 메뉴">
      <div class="nav__item"><a class="nav__link" href="index.html#features">제품</a></div>
      <div class="nav__item"><a class="nav__link" href="tools.html">도구</a></div>
      <div class="nav__item"><a class="nav__link" href="reviews.html">리뷰</a></div>
      <div class="nav__item"><a class="nav__link" href="search.html">검색</a></div>
      <div class="nav__item"><a class="nav__link" href="account.html">계정</a></div>
    </nav>
    <div class="nav__actions"><a class="nav__link" href="login.html">로그인</a></div>
    <button class="nav__toggle" type="button" aria-expanded="false" aria-label="메뉴"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 5h14M2 13h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
</header>
<main id="top" class="wrap" style="padding-top:var(--s-8);padding-bottom:var(--s-8)">
<div class="page-head"><h1>검색</h1><p class="lead-line">팀원이나 공유 폴더를 찾으세요.</p></div>
<form class="row-gap" method="get" action="search.html" style="margin-bottom:var(--s-6)">
  <input name="q" id="q" placeholder="검색어 입력" style="font:400 16px var(--font-text);padding:12px 14px;min-width:280px;border-radius:var(--r-sm);border:1px solid color-mix(in oklab,var(--p-ink) 18%,transparent)">
  <button class="btn btn--primary" type="submit">검색</button>
</form>
<h2 id="res-h" style="font-size:24px;margin:0 0 var(--s-4)"></h2>
<ul class="list-rows" id="list"></ul>
</main>

<footer class="footer closing" aria-labelledby="foot-h">
  <div class="wrap closing__links">
    <div class="grid">
      <div class="span-4 stack-4"><a class="footer__brand" href="index.html">Hearthfile</a><p class="footer__lede">소규모 팀을 위한 파일 공유.</p></div>
      <div class="span-2 footer__col"><h3 id="foot-h">제품</h3><ul><li><a href="index.html#features">기능</a></li><li><a href="tools.html">도구</a></li></ul></div>
      <div class="span-2 footer__col"><h3>고객</h3><ul><li><a href="reviews.html">리뷰</a></li><li><a href="search.html">검색</a></li></ul></div>
      <div class="span-2 footer__col"><h3>계정</h3><ul><li><a href="login.html">로그인</a></li><li><a href="account.html">계정</a></li></ul></div>
    </div>
    <div class="footer__legal"><span>&copy; 2026 Hearthfile</span></div>
  </div>
</footer>
<script>const q = new URLSearchParams(location.search).get('q') || '';
document.getElementById('q').value = q;
document.getElementById('res-h').innerHTML = '검색 결과: ' + q;
fetch('/api/search?q=' + encodeURIComponent(q)).then(r => r.json()).then(d => {
  const ul = document.getElementById('list');
  if (!d.results.length) { ul.innerHTML = '<li class="muted">결과가 없습니다.</li>'; return; }
  for (const n of d.results) { const li = document.createElement('li'); li.textContent = n; ul.appendChild(li); }
});</script>
</body>
